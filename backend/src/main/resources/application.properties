# Application
spring.application.name=FIFA 2026 Prode

# Server
server.port=8080

# Active Profile (dev or prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA Common Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.fifa2026.prode=DEBUG

# Football-Data.org API (reads from .env file)
football-data.enabled=${FOOTBALL_DATA_ENABLED:false}
football-data.api-key=${FOOTBALL_DATA_API_KEY:}
football-data.competition-id=${FOOTBALL_DATA_COMPETITION_ID:2000}
football-data.sync-interval=${FOOTBALL_DATA_SYNC_INTERVAL:300000}
