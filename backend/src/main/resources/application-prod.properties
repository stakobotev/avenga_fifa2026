# Production Profile - PostgreSQL + Azure AD

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prode}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.h2.console.enabled=false

# JPA - PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Azure AD OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_CLIENT_ID}

# Azure AD Configuration
azure.ad.tenant-id=${AZURE_TENANT_ID}
azure.ad.client-id=${AZURE_CLIENT_ID}

# CORS - Production origins
cors.allowed-origins=https://fifa2026.avenga.com
